plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.pickmobup'
version = '1.0.3'

def targetJavaVersion = 17

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url = 'https://repo.tcoded.com/releases' }
}

dependencies {
    // Lowest-common-denominator API so the jar runs on Spigot/Paper/Folia 1.20.1 -> latest
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'

    // Optional: only used when the PACKET mount mode is selected and the plugin is installed
    compileOnly 'com.github.retrooper:packetevents-spigot:2.7.0'

    // Shaded: cross-platform scheduler (Bukkit / Folia region threads)
    implementation 'com.tcoded:FoliaLib:0.5.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'com.tcoded.folialib', 'com.pickmobup.libs.folialib'
}

tasks.named('build') {
    dependsOn 'shadowJar'
}
